name: workflow.yml
run-name: ${{ github.actor }}
on:
  push:
    branches:
      - master

jobs:
  run_spring_boot:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: graalvm-community
          java-version: '25'
      - run: java --version
      - name: Setup Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: build with gradle
        run: ./gradlew bootJar
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: build/libs
      - name: Deploy and restart
        run: |
          sudo cp build/libs/app.jar /opt/myapp/app.jar
          sudo systemctl restart myapp
          for i in $(seq 1 20); do
            [ "$(systemctl is-active myapp)" = "active" ] && exit 0
            sleep 3
          done
          sudo journalctl -u myapp -n 50 --no-pager
          exit 1
  frontend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: myfrontside/package-lock.json
      - name: install dependecies
        working-directory: myfrontside
        run: npm ci
      - name: Build Nuxt
        working-directory: myfrontside
        run: npm run build
      - name: Deploy frontend
        run: |
            sudo rm -rf /opt/myfront/.output
            sudo cp -r myfrontside/.output /opt/myfront/.output
            sudo chown -R glevse:glevse /opt/myfront
            sudo systemctl restart myfront
            for i in $(seq 1 10); do
              [ "$(systemctl is-active myfront)" = "active" ] && exit 0
              sleep 3
            done
            sudo journalctl -u myfront -n 50 --no-pager
            exit 1